<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="../css/reserva.css">
</head>
<body>
    <main id="main">
        <section class="room">
            <img src="../assets/cabana_casal.jpg" alt="cabana de casal" id="img-cabin-one">
            <img src="../assets/bathtub.jpg" alt="banheiro" id="img-bathtub">
            <img src="../assets/cozinha.jpg" alt="cozinha" id="img-kitchen">
            <h3>Cabana de casal</h3>
        </section>
        <section class="room-info">
            <div class="info-boxes">
                <div class="i-box">
                    <p>1 quarto de casal</p>
                </div>
                <div class="i-box">
                    <p>1 banheiro privativo</p>
                </div>
                <div class="i-box">
                    <p>1 cozinha compartilhada</p>
                </div>
            </div>
            <h4>Serviços inclusos:</h4>
            <div class="info-services">
                <ul>
                    <li>Trilhas guiadas</li>
                    <li>Café da manhã</li>
                    <li>Jacuzzi aquecida</li>
                </ul>
            </div>
        </section>
        <section class="price">
            <div id="form">
                <input type="email" id="email" placeholder="Email">
            </div>
        </section>
    </main>
</body>
</html>
